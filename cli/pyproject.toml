[project]
name = "sbomdrift"
version = "0.1.3"
description = "Track how the vulnerability posture of your SBOMs changes over time — what became vulnerable since last time."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Samet Sanlikan", email = "sezersanlikan@gmail.com" }]
keywords = ["sbom", "cyclonedx", "spdx", "vulnerability", "osv", "supply-chain", "drift"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "lib4sbom>=0.7",
    "rich>=13.7",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]

[project.urls]
Homepage = "https://github.com/EngineerSamet/sbomdrift"
Repository = "https://github.com/EngineerSamet/sbomdrift"
Issues = "https://github.com/EngineerSamet/sbomdrift/issues"

[project.scripts]
sbomdrift = "sbomdrift.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    # Used only by evaluation/run_evaluation.py to render the report figures.
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbomdrift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
