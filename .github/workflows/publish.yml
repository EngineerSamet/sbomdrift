# SPDX-License-Identifier: Apache-2.0
name: publish

# Releasing is the third place this project refuses a long-lived credential.
# The alternative — a PyPI API token sitting in repository secrets — is a
# permanent, exfiltratable key with publish rights to a package other people
# install. Trusted Publishing replaces it with an OIDC identity that PyPI
# verifies against this exact repository, workflow and environment, and that
# expires in minutes.
#
# The other two places: OIDC to AWS instead of access keys, and keyless Sigstore
# signing instead of a private key. One position, applied three times.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build
        working-directory: cli
        run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: cli/dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # the OIDC token — the only credential this job holds
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
