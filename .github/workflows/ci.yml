# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Lint
        working-directory: cli
        run: uv run --python ${{ matrix.python }} ruff check .

      - name: Test
        working-directory: cli
        # The suite is entirely offline: the oracle is mocked, so a failure is a
        # failure of this code and never of someone else's uptime.
        run: uv run --python ${{ matrix.python }} pytest --cov=sbomdrift --cov-report=term-missing

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build wheel and sdist
        working-directory: cli
        run: uv build
      - name: Check the artefacts are installable
        working-directory: cli
        run: uv run --with dist/*.whl --no-project -- sbomdrift --version
